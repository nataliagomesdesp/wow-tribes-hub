# WoW Hub - Ownia Configuration
# Auto-generated by ownia-setup skill

app:
  name: wow-tribes-hub
  description: WoW Hub Platform - Despegar Way of Working
  language: typescript
  framework: next.js
  runtime: node:20

build:
  dockerfile: Dockerfile
  context: .
  args:
    NODE_ENV: production

healthcheck:
  path: /api/health
  interval: 30
  timeout: 5
  start_period: 10
  retries: 3

environment:
  # Application
  NODE_ENV: production
  NEXT_PUBLIC_APP_NAME: "WoW Hub"
  NEXT_PUBLIC_APP_VERSION: "1.0.0"

  # GitHub Integration (optional)
  NEXT_PUBLIC_GITHUB_OWNER: despegar
  NEXT_PUBLIC_GITHUB_REPO: wow-playbook

  # Analytics (optional)
  NEXT_PUBLIC_ANALYTICS_ID: ""

ports:
  - containerPort: 3000
    protocol: TCP

resources:
  cpu: 256
  memory: 512

autoscaling:
  minInstances: 1
  maxInstances: 3
  targetCPU: 70
  targetMemory: 80

logging:
  level: info
  format: json

tags:
  team: platform
  project: wow-hub
  environment: production
  managed_by: ownia

# Ownia will auto-detect:
# - GitHub repo from git remote
# - Dockerfile
# - Port from healthcheck
# - Build args from .env files
